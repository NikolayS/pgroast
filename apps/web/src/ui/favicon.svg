<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171923"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="bean" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0%" stop-color="#d99457"/>
      <stop offset="55%" stop-color="#8c4c23"/>
      <stop offset="100%" stop-color="#4e2610"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#5e6ad2" stroke-opacity="0.45" stroke-width="2"/>
  <!-- Roasted coffee bean (tilted 32deg) -->
  <g transform="translate(32 32) rotate(-32)">
    <ellipse cx="0" cy="0" rx="16.5" ry="22" fill="url(#bean)" stroke="#f0b67f" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M 0 -20.5 C -4.5 -8, 4.5 8, 0 20.5" fill="none" stroke="#180d07" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M -0.8 -19.5 C -5 -8, 3.8 8, -0.8 19.5" fill="none" stroke="#f7cfa3" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Public live emerald dot -->
  <circle cx="51" cy="13" r="5" fill="#4cb782" stroke="#0b0c0e" stroke-width="2"/>
</svg>
