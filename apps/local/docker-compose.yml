services:
  postgres:
    image: postgres:19
    container_name: pgroast-app-pg19
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgroast_local_dev
      POSTGRES_DB: pgroast_app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgroast_pg19_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pgroast_app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgroast_pg19_data:
